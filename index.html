function updateSyncState(){const n=JSON.parse(localStorage.qy_queue||"[]").length;const el=$("#syncState");if(!navigator.onLine){el.textContent="🟠 離線模式｜"+n+" 筆待同步";el.className="warn status"}else if(n){el.textContent="🟠 已連線｜"+n+" 筆等待同步";el.className="warn status"}else{el.textContent="🟢 所有打卡已同步";el.className="good status"}}

function lockKey(){return "qy_teamlock_"+config.activityId} function roundKey(){return "qy_round_"+config.activityId} function teamKey(){return localStorage.getItem(lockKey())||$("#team").value} function startKey(){return "qy_start_"+config.activityId+"_"+teamKey()} function applyTeamLock(){const round=config.roundId||"legacy";const seen=localStorage.getItem(roundKey());if(seen!==round){localStorage.removeItem(lockKey());Object.keys(localStorage).filter(k=>k.startsWith("qy_start_"+config.activityId+"_")).forEach(k=>localStorage.removeItem(k));localStorage.setItem(roundKey(),round)}const locked=localStorage.getItem(lockKey());if(locked&&config.teams.includes(locked)){$("#team").value=locked;$("#team").disabled=true;$("#team").title="比賽已開始，隊伍已鎖定"}else{$("#team").disabled=false;$("#team").title=""}}
function renderConfig(){config.mode=config.mode||"score";$("#activityInfo").innerHTML="<b>"+esc(config.name)+"</b>｜"+(config.mode==="sequence"?"順點賽":"積分賽")+"｜限時 "+config.limit+" 分鐘｜"+config.checkpoints.length+" 關";$("#team").innerHTML=config.teams.map(t=>'<option>'+esc(t)+'</option>').join("");$("#actName").value=config.name;$("#limit").value=config.limit;$("#raceMode").value=config.mode;$("#teams").value=config.teams.join("\n");$("#cps").value=config.checkpoints.map(c=>[c.id,c.name,c.score].join(",")).join("\n");applyTeamLock();renderProgress()}
async function loadConfig(){try{const s=await getDoc(configRef);if(s.exists())config=s.data();renderConfig()}catch(e){$("#activityInfo").textContent="活動設定尚未開放："+e.code}}
try{await loadConfig();localStorage.qy_config=JSON.stringify(config)}catch{}if((!navigator.onLine||!config.teams?.length)&&localStorage.qy_config){try{config=JSON.parse(localStorage.qy_config);renderConfig()}catch{}}
async function punch(type,checkpoint=""){const team=teamKey();if(!team)return show("請先選隊伍",false);const payload={id:crypto.randomUUID(),activityId:config.activityId,team,type,checkpoint,device,clientTime:new Date().toISOString()};let q=JSON.parse(localStorage.qy_queue||"[]");q.push(payload);localStorage.qy_queue=JSON.stringify(q);updateSyncState();renderProgress();if(!navigator.onLine){show("✓ 已存入平板｜目前 "+q.length+" 筆待同步",false);return}try{await setDoc(doc(runs,payload.id),{...payload,createdAt:serverTimestamp()});q=JSON.parse(localStorage.qy_queue||"[]").filter(x=>x.id!==payload.id);localStorage.qy_queue=JSON.stringify(q);updateSyncState();show("✓ 已同步："+(checkpoint||type),true)}catch(e){updateSyncState();show("✓ 已存入平板｜目前 "+JSON.parse(localStorage.qy_queue||"[]").length+" 筆待同步",false)}}
async function syncQueue(){if(!navigator.onLine){updateSyncState();return}const q=JSON.parse(localStorage.qy_queue||"[]");if(!q.length){updateSyncState();return}let left=[];for(const x of q){try{const id=x.id||crypto.randomUUID();await setDoc(doc(runs,id),{...x,id,createdAt:serverTimestamp()})}catch{left.push(x)}}localStorage.qy_queue=JSON.stringify(left);updateSyncState();if(q.length&&left.length===0)show("✓ 網路已恢復，"+q.length+" 筆離線打卡已全部同步",true)}
window.addEventListener("online",syncQueue);setInterval(syncQueue,8000);syncQueue();
function show(t,ok){$("#msg").innerHTML='<p class="'+(ok?"good":"warn")+'">'+esc(t)+'</p>'}

setInterval(()=>{const s=Number(localStorage.getItem(startKey())||0);$("#timer").textContent=s?"已進行 "+Math.floor((Date.now()-s)/1000)+" 秒":"尚未開始"},1000);
function parseQR(raw){try{const x=JSON.parse(raw);if(x.a!==config.activityId)return{err:"這不是本活動的 QR"};if(x.c==="START"&&x.t==="START")return{special:"START"};if(x.c==="FINISH"&&x.t==="FINISH")return{special:"FINISH"};const cp=config.checkpoints.find(c=>c.id===x.c&&c.token===x.t);return cp?{cp}:{err:"QR 防偽驗證失敗"}}catch{return{err:"無法辨識此 QR"}}}
function teamRecords(){const q=JSON.parse(localStorage.qy_queue||"[]");return [...logs,...q].filter(x=>x.activityId===config.activityId&&x.team===teamKey())} function sequenceOrder(team=teamKey()){const cps=config.checkpoints||[];if(!cps.length)return[];const ti=Math.max(0,config.teams.indexOf(team)),start=ti%cps.length;return cps.slice(start).concat(cps.slice(0,start))} function nextSequenceCheckpoint(rec,team=teamKey()){const seen=new Set(rec.filter(x=>x.type==="checkpoint").map(x=>x.checkpoint));return sequenceOrder(team).find(cp=>!seen.has(cp.id))}
async function handleScannedRaw(raw){const r=parseQR(raw);if(r.err){show(r.err,false);return}endScan();const rec=teamRecords(),s=Number(localStorage.getItem(startKey())||0),started=s||rec.some(x=>x.type==="start"),done=rec.some(x=>x.type==="finish");if(r.special==="START"){if(started)return show("此隊已經開始，不可重複掃起點",false);localStorage.setItem(lockKey(),$("#team").value);applyTeamLock();localStorage.setItem(startKey(),Date.now());await punch("start","START");if((config.mode||"score")==="sequence"){const first=sequenceOrder($("#team").value)[0];if(first)show("✓ 已開始！本隊第一站："+first.id+" "+first.name,true)}}else if(r.special==="FINISH"){if(!started)return show("請先掃起點 QR 開始",false);if(done)return show("此隊已經完成",false);if((config.mode||"score")==="sequence"){const next=nextSequenceCheckpoint(rec);if(next)return show("順點賽尚未完成全部關卡，下一關是："+next.id+" "+next.name,false)}await punch("finish","FINISH");localStorage.removeItem(startKey())}else{if(!started)return show("請先掃起點 QR 開始",false);if(done)return show("此隊已完成，不能再打卡",false);if(rec.some(x=>x.type==="checkpoint"&&x.checkpoint===r.cp.id))return show("這一關已經打卡過了",false);if((config.mode||"score")==="sequence"){const next=nextSequenceCheckpoint(rec);if(next&&r.cp.id!==next.id)return show("順序不對！請先前往："+next.id+" "+next.name,false)}await punch("checkpoint",r.cp.id)}}
async function beginScan(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("#video").srcObject=stream;$("#video").classList.remove("hidden");$("#stopScan").classList.remove("hidden");await $("#video").play();show("請將 QR Code 對準相機",true);
if("BarcodeDetector"in window){const det=new BarcodeDetector({formats:["qr_code"]});scanLoop=setInterval(async()=>{try{const b=await det.detect($("#video"));if(b[0])await handleScannedRaw(b[0].rawValue)}catch{}},350)}
else{const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});const tick=()=>{if(!stream)return;if($("#video").readyState>=2){canvas.width=$("#video").videoWidth;canvas.height=$("#video").videoHeight;ctx.drawImage($("#video"),0,0,canvas.width,canvas.height);const im=ctx.getImageData(0,0,canvas.width,canvas.height);const code=window.jsQR&&jsQR(im.data,im.width,im.height,{inversionAttempts:"attemptBoth"});if(code?.data){handleScannedRaw(code.data);return}}scanLoop=requestAnimationFrame(tick)};tick()}}
catch(e){show("無法開啟相機。請在瀏覽器設定中允許此網站使用相機。",false)}}
function endScan(){clearInterval(scanLoop);cancelAnimationFrame(scanLoop);stream?.getTracks().forEach(t=>t.stop());stream=null;$("#video").classList.add("hidden");$("#stopScan").classList.add("hidden")}$("#scan").onclick=beginScan;$("#stopScan").onclick=endScan;
$("#save").onclick=async()=>{const cps=$("#cps").value.split("\n").map(x=>x.trim()).filter(Boolean).map((x,i)=>{const [id,name,score]=x.split(",").map(v=>v.trim());const old=config.checkpoints.find(c=>c.id===id);return{id:id||String(i+1),name:name||id,score:Number(score)||10,token:old?.token||crypto.randomUUID().slice(0,8)}});config={activityId:config.activityId||"QY-"+Date.now(),name:$("#actName").value.trim()||"校園定向越野",limit:Number($("#limit").value)||40,mode:$("#raceMode").value||"score",teams:$("#teams").value.split("\n").map(x=>x.trim()).filter(Boolean),checkpoints:cps,updatedAt:new Date().toISOString()};try{await setDoc(configRef,config);renderConfig();alert("活動設定已儲存到雲端")}catch(e){alert("Firestore 規則尚未允許活動設定："+e.code)}};
$("#makeQR").onclick=async()=>{const base=location.origin+location.pathname;const all=[{id:"START",name:"起點",token:"START"},...config.checkpoints,{id:"FINISH",name:"終點",token:"FINISH"}];$("#qrs").innerHTML="";for(const c of all){const payload=JSON.stringify({a:config.activityId,c:c.id,t:c.token});const box=document.createElement("div");box.className="qrbox";box.innerHTML="<b>"+esc(c.id)+"｜"+esc(c.name)+"</b><br>";const qr=document.createElement("div");qr.style.width="180px";qr.style.height="180px";box.append(qr);$("#qrs").append(box);new QRCode(qr,{text:payload,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}};
function renderProgress(){const t=teamKey(),seen=new Set(logs.filter(x=>x.team===t&&x.type==="checkpoint").map(x=>x.checkpoint));$("#progress").innerHTML=config.checkpoints.map(c=>'<span class="pill">'+(seen.has(c.id)?"✓ ":"")+esc(c.id)+" "+esc(c.name)+'</span>').join("")}
function renderLogs(){const f=logs.filter(x=>x.activityId===config.activityId||!x.activityId);const fmtTW=v=>{if(!v)return"";try{return new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date(v))}catch{return v}};$("#logs").innerHTML=f.length?f.map(x=>'<div class="item"><b>'+esc(x.team)+'</b> <span class="pill">'+esc(x.checkpoint||x.type)+'</span> <small>'+esc(fmtTW(x.clientTime))+'</small></div>').join(""):'<p class="muted">目前沒有紀錄</p>';const teams={};for(const x of f){teams[x.team]??={team:x.team,start:null,finish:null,score:0,seen:new Set()};const z=teams[x.team];if(x.type==="start")z.start=x.clientTime;if(x.type==="finish")z.finish=x.clientTime;if(x.type==="checkpoint"&&!z.seen.has(x.checkpoint)){z.seen.add(x.checkpoint);z.score+=config.checkpoints.find(c=>c.id===x.checkpoint)?.score||0}}const all=config.teams.map(name=>{const z=teams[name]||{team:name,start:null,finish:null,score:0,seen:new Set()};const time=z.start&&z.finish?(new Date(z.finish)-new Date(z.start))/1000:null;const elapsed=z.start&&!z.finish?Math.max(0,(Date.now()-new Date(z.start).getTime())/1000):null;return{...z,time,elapsed,completed:!!z.finish}});const finished=all.filter(z=>z.completed).sort((a,b)=>b.score-a.score||a.time-b.time);const active=all.filter(z=>!z.completed).sort((a,b)=>(b.start?1:0)-(a.start?1:0)||b.score-a.score);const fmt=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+"分"+String(s%60).padStart(2,"0")+"秒"};const row=(z,rank)=>'<div class="item rank"><b>'+(rank?rank+". ":"")+esc(z.team)+'</b>｜'+z.seen.size+'/'+config.checkpoints.length+' 關｜'+z.score+' 分｜'+(z.completed?fmt(z.time):z.start?fmt(z.elapsed):"—")+'｜<span class="pill">'+(z.completed?"🏁 已完成":z.start?"🏃 進行中":"○ 尚未開始")+'</span></div>';$("#rankings").innerHTML='<h3>🏁 已完成（'+finished.length+'隊）</h3>'+(finished.length?finished.map((z,i)=>row(z,i+1)).join(""):'<p class="muted">目前尚無完賽隊伍</p>')+'<h3 style="margin-top:18px">🏃 進行中／尚未開始（'+active.length+'隊）</h3>'+active.map(z=>row(z,0)).join("");renderProgress()}
onSnapshot(configRef,s=>{if(s.exists()){const next=s.data();if(next.roundId&&next.roundId!==config.roundId){config=next;localStorage.qy_config=JSON.stringify(config);renderConfig()}}});
onSnapshot(query(runs,orderBy("createdAt","desc")),s=>{$("#cloud").textContent="● Firebase 雲端已連線";$("#cloud").className="good status";logs=s.docs.map(d=>({id:d.id,...d.data()}));renderLogs()},e=>{$("#cloud").textContent="● 雲端權限/連線異常："+e.code;$("#cloud").className="warn status"});

$("#newRound").onclick=async()=>{if(!confirm("確定要清除目前這個活動的所有打卡與排名嗎？\n此動作無法復原。"))return;config.roundId=crypto.randomUUID();await setDoc(configRef,{roundId:config.roundId},{merge:true});localStorage.qy_config=JSON.stringify(config);localStorage.setItem(roundKey(),config.roundId);const snap=await getDocs(runs);let batch=writeBatch(db),n=0;for(const d of snap.docs){const x=d.data();if(x.activityId===config.activityId||!x.activityId){batch.delete(d.ref);n++;if(n%450===0){await batch.commit();batch=writeBatch(db)}}}await batch.commit();Object.keys(localStorage).filter(k=>k.startsWith("qy_start_")||k.startsWith("qy_teamlock_")||k==="qy_queue").forEach(k=>localStorage.removeItem(k));alert("已清除本次成績，可以開始新一場！")};
$("#clearLocal").onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith("qy_start_")||k.startsWith("qy_teamlock_")||k==="qy_queue").forEach(k=>localStorage.removeItem(k));alert("此平板暫存已清除")};
$("#export").onclick=async()=>{const twTime=v=>{if(!v)return"";const d=new Date(v);if(isNaN(d))return v;return new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d)};const deviceMap=new Map();let deviceNo=0;const deviceLabel=v=>{if(!v)return"";if(!deviceMap.has(v))deviceMap.set(v,"裝置"+(++deviceNo));return deviceMap.get(v)};const rows=[["隊伍","關卡","類型","台灣時間","裝置"],...logs.map(x=>[x.team,x.checkpoint,x.type,twTime(x.clientTime),deviceLabel(x.device)])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="校園定向越野.csv";a.click()};
$("#entryQRBtn").onclick=()=>{const url=location.origin+location.pathname+"?mode=student";$("#entryQR").innerHTML="<div class=\"qrbox\"><b>學生入口</b><br><div id=\"entryCanvas\"></div><p style=\"max-width:240px;word-break:break-all;font-size:12px\">"+esc(url)+"</p></div>";new QRCode($("#entryCanvas"),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})};$("#printQR").onclick=()=>{if(!$("#qrs .qrbox"))return alert("請先按「產生 QR」");window.print()};$("#team").onchange=()=>{if(localStorage.getItem(lockKey())){applyTeamLock();show("比賽已開始，隊伍已鎖定，無法更換",false);return}renderProgress()};
</script></body></html>
